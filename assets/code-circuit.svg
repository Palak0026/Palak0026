<svg
  width="900"
  height="430"
  viewBox="0 0 900 430"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Pink glow -->
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Track path -->
    <path
      id="racePath"
      d="
      M 170 110
      C 90 110, 70 180, 110 225
      C 145 265, 145 320, 220 330
      L 665 330
      C 755 330, 805 285, 790 220
      C 775 160, 720 110, 650 110
      Z"
    />

    <!-- Gradient -->
    <linearGradient id="titleGradient" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="50%" stop-color="#ffc0df"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect
    width="900"
    height="430"
    rx="30"
    fill="#0d1117"
  />

  <!-- Stars / sparkles -->

  <g fill="#ffb6d9">

    <text x="70" y="70" font-size="22">✦</text>
    <text x="820" y="80" font-size="17">✦</text>
    <text x="100" y="355" font-size="15">✦</text>
    <text x="760" y="365" font-size="22">✦</text>
    <text x="440" y="70" font-size="13">♡</text>
    <text x="720" y="65" font-size="13">♡</text>

  </g>

  <!-- Track outer glow -->

  <use
    href="#racePath"
    fill="none"
    stroke="#ff69b4"
    stroke-width="24"
    opacity="0.15"
    filter="url(#pinkGlow)"
  />

  <!-- Main track -->

  <use
    href="#racePath"
    fill="none"
    stroke="#30363d"
    stroke-width="20"
  />

  <!-- Pink track border -->

  <use
    href="#racePath"
    fill="none"
    stroke="#ff69b4"
    stroke-width="3"
  />

  <!-- Center dashed racing line -->

  <use
    href="#racePath"
    fill="none"
    stroke="#ffb6d9"
    stroke-width="2"
    stroke-dasharray="12 15"
    opacity="0.65"
  />

  <!-- TITLE -->

  <text
    x="450"
    y="175"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="bold"
    fill="url(#titleGradient)">

    PALAK'S CODE CIRCUIT

  </text>

  <!-- Subtitle -->

  <text
    x="450"
    y="210"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    letter-spacing="3"
    fill="#ffffff">

    CODE • BUILD • LEARN • REPEAT

  </text>

  <!-- Tech stack -->

  <text
    x="450"
    y="245"
    text-anchor="middle"
    font-family="monospace"
    font-size="15"
    fill="#ffb6d9">

    Python • C • C++ • ML • AI • DSA

  </text>

  <!-- Cute text -->

  <text
    x="450"
    y="280"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="14"
    font-style="italic"
    fill="#c9d1d9">

    fueled by curiosity &amp; caffeine ♡

  </text>

  <!-- START / FINISH FLAG -->

  <g transform="translate(162 93)">

    <rect
      x="0"
      y="0"
      width="5"
      height="42"
      fill="#ffffff"/>

    <g transform="translate(5 0)">

      <rect width="12" height="10" fill="#ffffff"/>
      <rect x="12" width="12" height="10" fill="#ff69b4"/>

      <rect y="10" width="12" height="10" fill="#ff69b4"/>
      <rect x="12" y="10" width="12" height="10" fill="#ffffff"/>

      <rect y="20" width="12" height="10" fill="#ffffff"/>
      <rect x="12" y="20" width="12" height="10" fill="#ff69b4"/>

    </g>

  </g>

  <!-- Moving car -->

  <g>

    <!-- Car glow -->

    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#ff69b4"
      opacity="0.18"
      filter="url(#pinkGlow)"
    />

    <!-- Car -->

    <g transform="scale(1.15)">

      <!-- rear wing -->
      <rect
        x="-19"
        y="-8"
        width="7"
        height="16"
        rx="2"
        fill="#ff69b4"/>

      <!-- main body -->
      <path
        d="
        M -14 -7
        L 5 -7
        L 17 -3
        L 21 0
        L 17 3
        L 5 7
        L -14 7
        Z"
        fill="#ff69b4"
      />

      <!-- cockpit -->
      <ellipse
        cx="2"
        cy="0"
        rx="6"
        ry="4"
        fill="#111827"
      />

      <!-- front wing -->
      <rect
        x="17"
        y="-10"
        width="4"
        height="20"
        rx="2"
        fill="#ffc0df"
      />

      <!-- Wheels -->

      <rect
        x="-11"
        y="-11"
        width="8"
        height="5"
        rx="2"
        fill="#ffffff"
      />

      <rect
        x="-11"
        y="6"
        width="8"
        height="5"
        rx="2"
        fill="#ffffff"
      />

      <rect
        x="10"
        y="-10"
        width="7"
        height="5"
        rx="2"
        fill="#ffffff"
      />

      <rect
        x="10"
        y="5"
        width="7"
        height="5"
        rx="2"
        fill="#ffffff"
      />

      <!-- heart -->

      <text
        x="-5"
        y="4"
        font-size="9"
        fill="white">

        ♡

      </text>

    </g>

    <!-- Animate car around track -->

    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      rotate="auto">

      <mpath href="#racePath"/>

    </animateMotion>

  </g>

  <!-- Bottom label -->

  <text
    x="450"
    y="395"
    text-anchor="middle"
    font-family="monospace"
    font-size="13"
    fill="#8b949e">

    🏁 one commit closer to the finish line 🏁

  </text>

</svg>
